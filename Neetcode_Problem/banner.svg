<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="200" rx="12" fill="url(#bg)"/>
  
  <!-- decorative code brackets -->
  <text x="60" y="130" font-family="monospace" font-size="72" fill="rgba(56,189,248,0.15)" font-weight="bold">{</text>
  <text x="720" y="130" font-family="monospace" font-size="72" fill="rgba(192,132,252,0.15)" font-weight="bold">}</text>
  
  <!-- main title -->
  <text x="400" y="95" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="48" font-weight="700" fill="url(#text)" filter="url(#glow)">NeetCode 150</text>
  
  <!-- subtitle -->
  <text x="400" y="135" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="22" fill="#94a3b8" letter-spacing="3">PYTHON SOLUTIONS</text>
  
  <!-- accent line -->
  <line x1="300" y1="155" x2="500" y2="155" stroke="url(#text)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- progress dots -->
  <circle cx="360" cy="175" r="4" fill="#38bdf8"/>
  <circle cx="375" cy="175" r="4" fill="#818cf8"/>
  <circle cx="390" cy="175" r="4" fill="#c084fc"/>
  <circle cx="405" cy="175" r="4" fill="#a78bfa" opacity="0.5"/>
  <circle cx="420" cy="175" r="4" fill="#a78bfa" opacity="0.3"/>
  <circle cx="435" cy="175" r="4" fill="#a78bfa" opacity="0.15"/>
  <circle cx="450" cy="175" r="4" fill="#a78bfa" opacity="0.08"/>
</svg>
